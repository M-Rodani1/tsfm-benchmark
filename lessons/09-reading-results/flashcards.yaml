- q: Where does every number in reports/RESULTS.md come from?
  a: From stored tables in results/<run>/stats/*.parquet, listed with their SHA-256 in the Provenance
    section.
- q: What is the difference between an absent result and a null result?
  a: Absent = the model could not be evaluated (UNAVAILABLE), so no evidence either way; null = evaluated,
    no detectable difference.
- q: A comparison has raw p = 0.01 but Holm p = 0.20. Is it a finding?
  a: No. It does not survive the pre-specified multiple-testing correction.
- q: What does a relative loss of 0.95 [0.90, 1.01] mean?
  a: The model's loss is 5% below the reference on average, but the 95% CI includes 1 (no difference).
- q: What does it mean if the MCS contains several models?
  a: The data cannot distinguish them from the best model at the chosen confidence level.
- q: Why flag tests with fewer than 100 origins?
  a: The DM test's actual size is above nominal in small samples, so marginal p-values are unreliable.
- q: Name four items of the critique checklist.
  a: Real vs synthetic data, leakage, sample size, multiplicity (also effect size, contamination, robustness).
