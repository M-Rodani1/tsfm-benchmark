- see: "Values 10,000× too small"
  match: "Multiply by 100² = 1e4"
  why: "The result is in decimal², not %²."
  fix: "Multiply by `1e4`."
- see: "`nan` or `RuntimeWarning` in `log`"
  match: "invalid value encountered in log|divide by zero encountered in log"
  why: "Arguments swapped or a zero price."
  fix: "Check the argument order `o, h, l, c`."
- see: "Negative GK values / wrong values"
  match: "sign and constant of the open-close term|Values differ"
  why: "Wrong sign or constant on the `ln(C/O)` term."
  fix: "It is `− (2*np.log(2) - 1) * np.log(c/o)**2`."
- see: "`KeyError: 'sigma2'`"
  match: "KeyError: 'sigma2'"
  why: "Read the OHLCV file instead of the latent (truth) file."
  fix: "Use `synthetic_latent.csv`."
