- see: "`make: command not found` (Windows)"
  match: "make: .*not found"
  why: "No GNU make on this computer."
  fix: "Use WSL, or type the command after `make`'s recipe by hand, e.g. `uv run tsfm-rc doctor`."
- see: "`ModuleNotFoundError: tsfm_rc` (in Jupyter)"
  match: "No module named 'tsfm_rc'"
  why: "The notebook kernel is not the project's environment."
  fix: "Start Jupyter with `uv run jupyter lab` from the repository root."
- see: "`FileNotFoundError: … smoke …`"
  match: "FileNotFoundError: .*smoke"
  why: "No stored results for the smoke run on this computer."
  fix: "Run `make smoke` (about a minute)."
- see: "`FAIL fixtures` in doctor"
  match: "hash mismatch"
  why: "A fixture file was edited."
  fix: "Restore it with `git checkout data/fixtures`."
