- see: "`LinAlgError` / NaN coefficients"
  match: "LinAlgError|SVD did not converge"
  why: "NaNs in the design matrix (rolling means start empty)."
  fix: "Keep only rows where `X.notna().all(axis=1)`."
- see: "`ValueError: shapes not aligned`"
  match: "not aligned|all the input array dimensions"
  why: "Lag columns have different lengths."
  fix: "Slice every lag as `x[pmax - j : n_total - j]`."
- see: "Your GARCH path is wrong or explodes"
  match: "Use the \\*previous\\* day's variance|Off by one|Values differ from s\\[t\\]"
  why: "Used `eps[t]` instead of `eps[t-1]`, or `s0` instead of `s[t-1]`."
  fix: "Tomorrow depends on today's shock and today's variance."
- see: "`KeyError: 'b_d'`"
  match: "KeyError: 'b_d'"
  why: "Looked at the GARCH spec."
  fix: "HAR parameters are under `SYN_HAR_A`."
