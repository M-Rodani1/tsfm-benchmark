- see: "`RuntimeWarning: divide by zero` / `nan`"
  match: "divide by zero|invalid value"
  why: "A forecast of 0 or a negative variance."
  fix: "Variance forecasts must be > 0; the study never clips silently, it returns NaN."
- see: "Checker: \"un-normalised form\""
  match: "un-normalised form"
  why: "Used `ln f + y/f`."
  fix: "Use `y/f − ln(y/f) − 1`."
- see: "Checker: \"Ratio upside down\""
  match: "Ratio upside down"
  why: "Computed f/y."
  fix: "It is y/f (truth over forecast)."
