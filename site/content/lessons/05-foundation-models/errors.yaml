- see: "`UNAVAILABLE: python package … not installed`"
  match: "not installed"
  why: "The foundation-model packages (PyTorch) are not installed. In the browser they never are."
  fix: "On your computer: `make install-tsfm` (downloads PyTorch, about 6 GB)."
- see: "`UNAVAILABLE: could not download …`"
  match: "could not download"
  why: "No internet, a proxy or a firewall blocked Hugging Face."
  fix: "Check the connection, then `make doctor ONLINE=1`."
- see: "Checker: \"That is exp(median)\""
  match: "exp\\(median\\)"
  why: "You returned the median of exp(X), not its mean."
  fix: "Add s²/2 inside the exp."
- see: "Checker: \"Use s²/2, not s\""
  match: "Use s²/2"
  why: "The lognormal mean uses half the *variance*."
  fix: "`np.exp(median + s**2 / 2)`."
