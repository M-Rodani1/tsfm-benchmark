- see: "Checker shows a one-character difference"
  match: "got: .*\\n\\s*want:"
  why: "Spacing or punctuation differs."
  fix: "Copy the f-string pattern exactly, including the final full stop."
- see: "`NameError: name 'ci' is not defined`"
  match: "name '(ci|fp)' is not defined"
  why: "The helper was not imported in this session."
  fix: "Run the lesson's first code cell."
- see: "Your claim is \"UNSUPPORTED\""
  match: "UNSUPPORTED"
  why: "The evidence is not there."
  fix: "Delete or weaken the claim; don't hunt for another test."
