- see: "`FileNotFoundError: … smoke …`"
  match: "FileNotFoundError: .*smoke"
  why: "No stored results on this computer."
  fix: "`make smoke` (about a minute)."
- see: "`UndefinedVariableError` in `.query(...)`"
  match: "UndefinedVariableError|name '.*' is not defined"
  why: "A column name typo inside the query string."
  fix: "`dm_all.columns` lists the real names."
- see: "Checker: \"significant only BEFORE correction\""
  match: "BEFORE correction"
  why: "Your verdict used the raw p-value."
  fix: "Use `p_holm`."
- see: "Checker: \"Check the sign\""
  match: "Check the sign"
  why: "Better and worse are swapped."
  fix: "Negative `mean_diff` = lower loss = model better."
