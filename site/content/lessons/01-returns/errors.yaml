- see: "`ProviderError: SYN_X: not in fixture`"
  match: "not in fixture"
  why: "Ticker name typo."
  fix: "Use one of `SYN_GARCH_A`, `SYN_GARCH_B`, `SYN_HAR_A`, `SYN_HAR_B`, `SYN_QUIRKS`."
- see: "`RuntimeWarning: divide by zero in log`"
  match: "divide by zero encountered in log"
  why: "A price of 0 or a missing value."
  fix: "Check `prices.min() > 0`; drop NaNs first."
- see: "Your number is 100× too small"
  match: "Looks like you forgot the factor 100"
  why: "The study's returns are in percent."
  fix: "Multiply by 100."
- see: "Off by one day"
  match: "got .*expected"
  why: "Used the wrong pair of rows."
  fix: "The target runs from row i to row i + h (its daily returns are rows i+1 … i+h)."
- see: "`IndexError`"
  match: "^IndexError"
  why: "`i + h` is past the end of the array."
  fix: "Choose `i < len(prices) - h`."
